dice_task_orchestrator:
  ros__parameters:
    # Face the die should end up showing (1-6). 0 = unset: run_on_start is
    # skipped and you must set it + call the service explicitly, e.g.
    #   ros2 param set /dice_task_orchestrator target_face 6
    #   ros2 service call /dice_task_orchestrator/reach_target_face std_srvs/srv/Trigger "{}"
    target_face: 0

    # Safety bound on how many pick-rotate-place rolls a single request
    # may take. Every roll is a 90 deg quarter-turn about a fixed WORLD
    # axis. The die's full orientation needs at most 1 calibration roll
    # to become known (real perception only reports the up face's
    # number, never its yaw -- see dice_face_map.py's module docstring,
    # "Why two faces, not one") and, once known, reaching any target from
    # any orientation is at most 3 more rolls, proven by BFS over the
    # reachable orientation graph (see test_dice_face_map.py) -- 4 total,
    # worst case. Kept well above that anyway to leave room for a blocked
    # roll (see dice_task_orchestrator's _blocked set) or a recoverable
    # failure forcing a re-identify/re-calibration without progress,
    # without masking a genuinely stuck cell.
    max_attempts: 15

    # Below this (deg), a die found off world-Z yaw is considered already
    # straight and the one-time pre-calibration straightening roll (see
    # dice_task_orchestrator's module docstring, "CALIBRATE", and
    # _calibrate()) is skipped.
    deyaw_tolerance_deg: 1.0

    # After every executed roll, the die is expected within this many
    # metres (world XY) of dice_manipulation_node's own release_position
    # -- roll_dice() always carries it there in the same move as the
    # rotation, see that module's docstring. Farther than this (a bad
    # grasp, a bounce/roll off the intended spot, ...) -- or the up face
    # not matching what the tracked layout predicted for the commanded
    # roll -- and _post_roll_sanity_check() distrusts the whole roll: the
    # tracked orientation is dropped and the next identify restarts from
    # CALIBRATE instead of trusting from_two_faces() on it. See
    # _post_roll_sanity_check()'s docstring for both checks.
    release_position_tolerance_m: 0.05

    # Name of the dice_manipulation_node instance to drive (its
    # set_parameters and ~/pick_rotate_place services).
    manipulation_node_name: "dice_manipulation_node"

    # Perception service contract (see drims_homework/dice_common.py).
    dice_identification_service: "dice_identification"

    run_on_start: false
